name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit registry
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check all targets
        run: moon check --target all

      - name: Test all targets
        run: moon test --target all

      - name: Benchmarks
        run: moon bench --target wasm

      - name: Build
        run: moon build

      - name: CLI smoke test
        run: moon run cmd/main -- convert wkt geojson "POINT (1 2)"

      - name: Example smoke test
        run: moon run examples/quickstart
